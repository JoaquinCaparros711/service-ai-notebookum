services:
    ai:
        image: notebookum-ai:v1.2.0
        restart: unless-stopped
        deploy:
            replicas: 2
        networks:
            notebookum-network:
                aliases:
                    - ai.universidad.localhost
        environment:
            - CONSUL_URL=http://consul:8500

networks:
    notebookum-network:
        external: true
